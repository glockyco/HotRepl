name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Bootstrap locked dependencies
        run: nix run .#bootstrap

      - name: Run canonical repository gate
        run: nix run .#check

      - name: Lint pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: nix develop --command commitlint --from "$BASE" --to "$HEAD" --verbose

  ci-success:
    name: CI Success
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
