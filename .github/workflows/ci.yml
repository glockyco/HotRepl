name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run canonical repository gate
        run: nix run .#check

      # Defined once for the whole workstation in the fleet input. Fails on an
      # invalid artifact and on a change archived with unfinished tasks.
      - name: Validate OpenSpec artifacts
        run: nix build --no-link ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).openspec"

      - name: Lint pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: nix develop --command commitlint --from "$BASE" --to "$HEAD" --verbose

  windows-packages:
    name: check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build and test TypeScript packages
        run: bun run test

      - name: Typecheck TypeScript packages
        run: bun run typecheck

  ci-success:
    name: CI Success
    if: always()
    needs: [check, windows-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          RESULT: ${{ needs.check.result }}
          WINDOWS_RESULT: ${{ needs.windows-packages.result }}
        run: test "$RESULT" = success && test "$WINDOWS_RESULT" = success
