name: Release

# Triggers:
#   - push to main: changesets/action either opens/updates a "Version
#     packages" PR (when there are pending .changeset/* files), or
#     publishes the previously-merged Version PR's bumps to npm and
#     creates one GitHub Release per published package.
#   - workflow_dispatch: manual recovery rerun; behaves identically.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Defense in depth: every action is pinned to an immutable commit SHA
# so a compromised moving tag cannot silently hijack the release
# pipeline. Comments next to each pin record the human-readable
# version for easier upgrades.

# Serialize releases per ref. cancel-in-progress stays at the default
# (false) so an in-flight npm publish is never killed by a follow-up
# commit — we'd rather queue than retry mid-publish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # contents:write       push the Version PR's commits/tags, create GH Releases
    # pull-requests:write  open and update the Version PR
    # id-token:write       request the OIDC JWT for npm trusted publishing
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # fetch-depth: 0 gives @changesets/changelog-github full git
      # history so it can resolve PR numbers and commit authors when
      # generating per-package CHANGELOG.md entries.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          lfs: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Node 24 ships npm 11.5.1+, the floor for npm trusted publishing
      # via OIDC. Bun's own `bun publish` does not yet participate in
      # npm OIDC (oven-sh/bun#22423, #15601), so the actual publish call
      # routes through `npm publish` invoked by `changeset publish`.
      # Deliberately no `registry-url:` — setup-node writes an .npmrc
      # with a placeholder NODE_AUTH_TOKEN when registry-url is set,
      # which can confuse OIDC diagnosis when no token is needed.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          # `bun run release` builds dist/ first, then runs
          # `changeset publish`, which checks every package.json's
          # version against the npm registry and publishes only the
          # ones that aren't there yet. Idempotent: running on a push
          # that has no version bumps is a no-op.
          publish: bun run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          # createGithubReleases defaults to true; left implicit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt-and-braces: trusted publishing already generates
          # provenance automatically for public-repo + public-package
          # combinations, but the explicit flag matches the npm
          # documentation and surfaces failures earlier if a future
          # private package slips into the publish loop.
          NPM_CONFIG_PROVENANCE: "true"
