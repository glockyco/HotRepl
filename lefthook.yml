# Lefthook configuration: local hook gate.
#
# Invariant: this gate must catch >= what CI catches. CI enters the pinned Nix
# environment and runs this pre-push gate directly so drift is impossible.
#
# pre-commit operates on staged files only and auto-stages tool fixes
# (CSharpier, dprint). pre-push runs the full repository gate.
#
# `scripts/run-in-nix.sh` uses the current development shell or enters it once
# for a standalone hook command. `dotnet tool restore` and
# `bun install --frozen-lockfile` hydrate only repository-local ignored state.
#
# Why pre-push omits a standalone CSharpier check: CSharpier.MsBuild runs
# inside `dotnet build` (Directory.Build.props sets CSharpier_Check=true),
# so the dotnet-build command already fails on unformatted C#.

pre-commit:
  parallel: true
  commands:
    csharpier:
      glob: "*.cs"
      run: scripts/run-in-nix.sh dotnet csharpier format {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.{md,json,jsonc,json5,yml,yaml,toml,ts}"
      run: scripts/run-in-nix.sh dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    plans-docs:
      glob: "docs/plans/**/*.md"
      run: omp-plans index && omp-plans check
      stage_fixed: true
      skip:
        - run: "! command -v omp-plans"
    typos:
      run: scripts/run-in-nix.sh typos
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: scripts/run-in-nix.sh actionlint
    command-examples:
      glob: "{.claude/skills/hotrepl/SKILL.md,src/HotRepl.UnityCommands/UnityCommandCatalogNames.cs,scripts/check-command-examples.py}"
      run: scripts/run-in-nix.sh python3 scripts/check-command-examples.py

commit-msg:
  commands:
    commitlint:
      run: scripts/run-in-nix.sh commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    bun-install:
      run: scripts/run-bun.sh install --frozen-lockfile
    bun-test:
      run: scripts/run-bun.sh run test
    bun-typecheck:
      run: scripts/run-bun.sh run typecheck
    schemas-export:
      run: scripts/run-bun.sh run schemas:export
    site-check:
      run: scripts/run-bun.sh run --cwd site check
    site-build:
      run: scripts/run-bun.sh run --cwd site build
    dprint-check:
      run: scripts/run-in-nix.sh dprint check
    typos:
      run: scripts/run-in-nix.sh typos
    actionlint:
      run: scripts/run-in-nix.sh actionlint
    command-examples:
      run: scripts/run-in-nix.sh python3 scripts/check-command-examples.py
    loader-build-contract:
      run: scripts/run-in-nix.sh scripts/test-build-loader.sh
    dotnet-build:
      run: |
        scripts/run-in-nix.sh dotnet tool restore
        scripts/run-in-nix.sh dotnet build src/HotRepl.Core/HotRepl.Core.csproj --nologo -v q
    dotnet-test:
      run: |
        scripts/run-in-nix.sh dotnet tool restore
        scripts/run-in-nix.sh dotnet test tests/HotRepl.Tests/HotRepl.Tests.csproj --nologo -v q
